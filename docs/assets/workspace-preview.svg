<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Selektos database workspace</title>
  <desc id="description">A dark native macOS workspace showing a connected PostgreSQL database, SQL query, result grid, and record inspector.</desc>
  <defs>
    <linearGradient id="toolbar" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#2c3648"/>
      <stop offset="1" stop-color="#222b3b"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0" x2="1">
      <stop stop-color="#1e2737"/>
      <stop offset="1" stop-color="#192231"/>
    </linearGradient>
    <linearGradient id="editor" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#151e2d"/>
      <stop offset="1" stop-color="#111927"/>
    </linearGradient>
    <linearGradient id="selected" x1="0" x2="1">
      <stop stop-color="#213c69"/>
      <stop offset="1" stop-color="#1a3157"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
